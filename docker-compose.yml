version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eirene_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eirene_db
    ports:
      - '5432:5432'
    volumes:
      - eirene_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eirene_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eirene_pgdata:
    driver: local
